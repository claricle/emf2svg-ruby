inherit_from:
  - 'https://raw.githubusercontent.com/riboseinc/oss-guides/master/ci/rubocop.yml'

AllCops:
  TargetRubyVersion: 2.7
  SuggestExtensions: false
  Exclude:
    - 'tmp/**/*'
    - 'pkg/**/*'
    - 'ports/**/*'
    - 'vendor/**/*'

Gemspec/RequireMFA:
  Enabled: false

# Opinionated modern rubocop cops added since 1.5.2. The gemspec's
# existing structure (add_runtime_dependency for runtime, dev deps in
# gemspec so `gem install` works without bundler) is intentional.
Gemspec/AddDependency:
  Enabled: false
Gemspec/DevelopmentDependencies:
  Enabled: false
