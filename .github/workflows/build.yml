name: build

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '*.adoc'
  pull_request:
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }}-${{ github.job }}-${{ github.head_ref || github.ref_name }}'
  cancel-in-progress: true

jobs:
  prepare:
    uses: metanorma/ci/.github/workflows/prepare-rake.yml@main

  test:
    name: Test on Ruby ${{ matrix.ruby.version }} ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    needs: prepare
    if: needs.prepare.outputs.push-for-tag != 'true'

    continue-on-error: ${{ matrix.ruby.experimental }}
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
    - uses: actions/checkout@v4

    - uses: ruby/setup-ruby@master
      with:
        bundler-cache: true
        ruby-version: ${{ matrix.ruby.version }}
        rubygems: ${{ matrix.ruby.rubygems }}

    # https://github.com/microsoft/vcpkg/issues/15931
    # no good solution :(
    - name: Workaround for vcpkg
      if: startsWith(matrix.os, 'ubuntu') || startsWith(matrix.os, 'macos')
      shell: bash
      run: |
        if [[ "$RUNNER_OS" == "Linux" ]]; then
          sudo apt-get update
          sudo apt-get install -y gperf autoconf autoconf-archive automake libtool
        elif [[ "$RUNNER_OS" == "macOS" ]]; then
          brew install gperf autoconf autoconf-archive automake libtool
        fi

    - run: |
        which make || true
        which clang || true
        which gcc || true

    - run: bundle exec rake

  build:
    name: build ${{ matrix.os }}, ${{ matrix.ruby-version }}, ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: any
            ruby-version: ${{ needs.prepare.outputs.default-ruby-version }}
          - os: ubuntu-latest
            platform: x86_64-linux
            ruby-version: ${{ needs.prepare.outputs.default-ruby-version }}
          - os: ubuntu-24.04-arm
            platform: aarch64-linux
            ruby-version: ${{ needs.prepare.outputs.default-ruby-version }}
          - os: windows-latest
            platform: x64-mingw32
            ruby-version: ${{ needs.prepare.outputs.default-ruby-version }}
          - os: windows-latest
            platform: x64-mingw-ucrt
            ruby-version: ${{ needs.prepare.outputs.default-ruby-version }}
          - os: windows-11-arm
            platform: aarch64-mingw-ucrt
            ruby-version: ${{ needs.prepare.outputs.default-ruby-version }}
          - os: macos-latest
            platform: arm64-darwin
            ruby-version: ${{ needs.prepare.outputs.default-ruby-version }}
          - os: macos-15-intel
            platform: x86_64-darwin
            ruby-version: ${{ needs.prepare.outputs.default-ruby-version }}
    steps:
    - uses: actions/checkout@v4

    - name: Setup Ruby
      uses: ruby/setup-ruby@master
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true

    - name: Workaround for vcpkg
      if: startsWith(matrix.os, 'ubuntu') || startsWith(matrix.os, 'macos')
      shell: bash
      run: |
        if [[ "$RUNNER_OS" == "Linux" ]]; then
          sudo apt-get update
          sudo apt-get install -y gperf autoconf autoconf-archive automake libtool
        elif [[ "$RUNNER_OS" == "macOS" ]]; then
          brew install gperf autoconf autoconf-archive automake libtool
        fi

    - run: bundle exec rake gem:native:${{ matrix.platform }}

    - if: matrix.platform != 'any'
      uses: metanorma/ci/native-deps-action@main
      with:
        libname: emf2svg
        directory: lib/emf2svg

    - uses: actions/upload-artifact@v4
      with:
        name: pkg-${{ matrix.platform }}
        path: pkg/*.gem

  # Musl builds run inside an Alpine container so the resulting libs
  # link against musl libc, not the runner's glibc.
  build-musl:
    name: build-musl ${{ matrix.os }}, ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    needs: prepare
    container:
      image: alpine:3.20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: x86_64-linux-musl
          - os: ubuntu-24.04-arm
            platform: aarch64-linux-musl
    steps:
    - uses: actions/checkout@v4

    - name: Install Alpine build deps
      shell: sh
      run: |
        apk add --no-cache \
          bash curl git cmake ninja gcc g++ gperf automake autoconf \
          autoconf-archive libtool linux-headers perl \
          ruby ruby-dev ruby-bundler ruby-rake file

    - name: Bundle install
      run: bundle install --jobs 4 --retry 3

    - run: bundle exec rake gem:native:${{ matrix.platform }}

    - uses: actions/upload-artifact@v4
      with:
        name: pkg-${{ matrix.platform }}
        path: pkg/*.gem

  test-build:
    needs: [ prepare, build, build-musl ]
    runs-on: ${{ matrix.os }}

    continue-on-error: ${{ matrix.ruby.experimental }}
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
    - uses: actions/checkout@v4

    - uses: ruby/setup-ruby@master
      with:
        bundler-cache: true
        ruby-version: ${{ matrix.ruby.version }}
        rubygems: ${{ matrix.ruby.rubygems }}

    - uses: actions/download-artifact@v4
      with:
        pattern: pkg-*
        path: pkg
        merge-multiple: true

    - name: Install binary gem
      run: gem install -b pkg/emf2svg-$(ruby -I lib -r emf2svg/version -e "puts Emf2svg::VERSION")-$(ruby -e "puts RUBY_PLATFORM.sub(/darwin\d{2}$/, 'darwin')").gem
# MacOS with have something like arm64-darwin19, others just aarch64-linux
    - name: Test conversion
      run: |
        ruby -remf2svg -e "puts File.write('output.svg', Emf2svg.from_file('spec/examples/image1.emf'), mode: 'wb')"

  test-build-any:
    needs: [ prepare, build, build-musl ]
    runs-on: ${{ matrix.os }}

    continue-on-error: ${{ matrix.ruby.experimental }}
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
    - uses: actions/checkout@v4

    - uses: ruby/setup-ruby@master
      with:
        bundler-cache: true
        ruby-version: ${{ matrix.ruby.version }}
        rubygems: ${{ matrix.ruby.rubygems }}

    - uses: actions/download-artifact@v4
      with:
        pattern: pkg-*
        path: pkg
        merge-multiple: true

    - name: Workaround for vcpkg
      if: startsWith(matrix.os, 'ubuntu') || startsWith(matrix.os, 'macos')
      shell: bash
      run: |
        if [[ "$RUNNER_OS" == "Linux" ]]; then
          sudo apt-get update
          sudo apt-get install -y gperf autoconf autoconf-archive automake libtool
        elif [[ "$RUNNER_OS" == "macOS" ]]; then
          brew install gperf autoconf autoconf-archive automake libtool
        fi

    - name: Install native gem
      run: gem install -b pkg/emf2svg-$(ruby -I lib -r emf2svg/version -e "puts Emf2svg::VERSION").gem

    - name: Test conversion
      run: |
        ruby -remf2svg -e "puts File.write('output.svg', Emf2svg.from_file('spec/examples/image1.emf'), mode: 'wb')"
