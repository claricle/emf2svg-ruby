name: release

on:
  push:
    tags:
      - 'v*'

# id-token: write is required for RubyGems.org Trusted Publishing
# (OIDC). The publish job exchanges the GitHub OIDC token for a
# short-lived rubygems API key -- no long-lived secret in the repo.
permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: any
            ruby-version: '3.3'
          - os: ubuntu-latest
            platform: x86_64-linux
            ruby-version: '3.3'
          - os: windows-latest
            platform: x64-mingw32
            ruby-version: '3.3'
          - os: windows-latest
            platform: x64-mingw-ucrt
            ruby-version: '3.3'
          - os: macos-latest
            platform: x86_64-darwin
            ruby-version: '3.3'
    steps:
    - uses: actions/checkout@v4

    - uses: ruby/setup-ruby@master
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true

    - name: Workaround for vcpkg
      if: startsWith(matrix.os, 'ubuntu') || startsWith(matrix.os, 'macos')
      shell: bash
      run: |
        if [[ "$RUNNER_OS" == "Linux" ]]; then
          sudo apt-get update
          sudo apt-get install -y gperf autoconf autoconf-archive automake libtool
        elif [[ "$RUNNER_OS" == "macOS" ]]; then
          brew install gperf autoconf autoconf-archive automake libtool
        fi

    - run: bundle exec rake gem:native:${{ matrix.platform }}

    - uses: actions/upload-artifact@v4
      with:
        name: pkg-${{ matrix.platform }}
        path: pkg/*.gem

    - name: Install gem
      run: gem install -b pkg/emf2svg-*.gem

    - name: Test conversion
      run: |
        ruby -remf2svg -e "puts File.write('output.svg', Emf2svg.from_file('spec/examples/image1.emf'), mode: 'wb')"

  cross:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: aarch64-linux
            ruby-version: '3.3'
          - os: macos-latest
            platform: arm64-darwin
            ruby-version: '3.3'
    steps:
    - uses: actions/checkout@v4

    - name: Install Ubuntu packages
      if: startsWith(matrix.os, 'ubuntu')
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu binutils-aarch64-linux-gnu gperf autoconf autoconf-archive automake libtool

    - name: Install macOS packages
      if: startsWith(matrix.os, 'macos')
      run: brew install gperf autoconf autoconf-archive automake libtool

    - uses: ruby/setup-ruby@master
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true

    - run: bundle exec rake gem:native:${{ matrix.platform }}

    - uses: actions/upload-artifact@v4
      with:
        name: pkg-${{ matrix.platform }}
        path: pkg/*.gem

    - name: Install gem
      run: gem install -b pkg/emf2svg-*.gem

  publish:
    needs: [ build, cross ]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: ruby/setup-ruby@master
      with:
        ruby-version: '3.3'
        bundler-cache: true

    - uses: actions/download-artifact@v4
      with:
        pattern: pkg-*
        path: pkg
        merge-multiple: true

    - name: Configure RubyGems credentials (Trusted Publishing / OIDC)
      uses: rubygems/configure-rubygems-credentials@main

    - name: Publish to rubygems.org
      run: |
        for gem in pkg/*.gem; do gem push -V "$gem"; done
